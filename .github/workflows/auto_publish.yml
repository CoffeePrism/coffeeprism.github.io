name: 自动文章生成与发布

on:
  # 2026-05-04 恢复：generator 已加 4 道质量门槛（XML 输出 / 字数重试 /
  # 主题去重 / pillar 链接），不会再批量产出薄内容。
  # 2026-11-17：免费代理 x.linq.ai 失效，2026-09-19 之后 0 产出却一直绿灯。
  # 现改用 repo secrets 里的 OPENROUTER_API_KEY / NVIDIA_API_KEY（或自定义
  # LLM_API_KEY + vars.LLM_BASE_URL）；0 产出时网站照常构建部署，但整个
  # 运行会被标红（见最后的 report job），GitHub 会邮件通知。
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      generate:
        description: '生成新文章（取消勾选 = 只构建部署当前代码，例如改了模板/配置）'
        type: boolean
        default: true
      articles:
        description: '本次常规文章篇数（留空 = 仓库变量 REGULAR_ARTICLES_PER_RUN，默认 1）'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      generate_outcome: ${{ steps.generate.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 安装Python依赖
        run: pip install -r requirements.txt

      - name: 设置Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 锁定版本：'latest' 会在 Hugo 移除已弃用的配置项（languageCode 等，
          # 构建日志里已有 deprecated 警告）时让每日任务突然构建失败。
          # 升级时先本地 `hugo --minify` 验证再改这里。
          hugo-version: '0.170.0'
          extended: true

      - name: 配置Git
        run: |
          git config --global user.name "自动发布机器人"
          git config --global user.email "autobot@coffeeprism.com"

      - name: 生成文章
        id: generate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.generate }}
        # 失败不阻断构建部署（模板/配置改动照常上线），由 report job 统一标红
        continue-on-error: true
        env:
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          # LLM：按 自定义 → OpenRouter → NVIDIA 顺序回退，未配置的自动跳过
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          REGULAR_ARTICLES_PER_RUN: ${{ inputs.articles || vars.REGULAR_ARTICLES_PER_RUN }}
          TRENDING_QUOTA: ${{ vars.TRENDING_QUOTA }}
        run: python scripts/generate_and_publish.py

      - name: 构建网站
        run: hugo --minify --themesDir ./themes

      - name: 记下要推给 IndexNow 的 URL
        # 部署前把新构建的 sitemap 和线上的比对：只推新增、lastmod 变了、
        # 以及删除/合并跳转的 URL，每个变化只推一次（以前按「3 天内 lastmod」推，
        # 同一网址会连推 3 天）。比对失败时脚本自己退回 3 天窗口。
        continue-on-error: true
        run: python3 scripts/indexnow_submit.py --diff-build public --out indexnow-urls.txt

      - name: 上传 IndexNow URL 列表
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: 提交新文章到main分支
        # 只提交 content/。public/ 不再入库：Pages 用下面上传的构建产物部署。
        # 以前每天强推 public/ 的时间戳变动，让"没有新文章"也天天出现
        # 「添加新文章」提交，掩盖了 2026-09 起的断更。
        run: |
          git add content
          if git diff --cached --quiet; then
            echo "没有新文章需要提交"
            exit 0
          fi
          git commit -m "自动发布: 添加新文章 - $(date +%Y-%m-%d)"
          git push origin main

      - name: 上传页面工件
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-and-build
    steps:
      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # deploy 成功后把构建时记下的变化 URL 推给 IndexNow（Bing/Copilot 等）。
    # 不要每天推全量：Bing 会提示 “Avoid IndexNow Batch Mode”。
    # Bing 索引喂 Copilot、DeepSeek 候选集、豆包全网搜索 —— 即时推送比
    # 等爬虫快几天到几周。失败不影响发布（continue-on-error）。
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 取回 URL 列表
        uses: actions/download-artifact@v4
        continue-on-error: true  # 没有列表时下一步退回 3 天窗口
        with:
          name: indexnow-urls
      - name: IndexNow 提交
        run: |
          sleep 60  # 等 Pages CDN 生效，确保 key 文件可被 IndexNow 验证
          if [ -f indexnow-urls.txt ]; then
            python3 scripts/indexnow_submit.py --from-file indexnow-urls.txt
          else
            python3 scripts/indexnow_submit.py
          fi

  report:
    # 文章生成失败（0 产出 / 无可用 LLM）时把整个运行标红 → GitHub 邮件通知。
    # 放在部署之后，保证网站本身照常更新。
    runs-on: ubuntu-latest
    needs: [generate-and-build, deploy]
    if: ${{ always() }}
    steps:
      - name: 检查文章生成结果
        run: |
          outcome="${{ needs.generate-and-build.outputs.generate_outcome }}"
          echo "生成步骤结果: ${outcome:-（未运行）}"
          if [ "$outcome" = "failure" ]; then
            echo "::error title=今日没有发布新文章::打开 generate-and-build → 生成文章 步骤查看原因（LLM key 失效/余额不足/服务不可达，或选题全部重复）"
            exit 1
          fi
